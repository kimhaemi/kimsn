plugins {
    id 'org.springframework.boot'
}

dependencies {
    implementation project(':common-data')
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.json:json:20230618'
    implementation 'com.jcraft:jsch:0.1.55'

    // Annotation Processor 추가
    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"
}

tasks.named('test') { useJUnitPlatform() }
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

bootJar { enabled = false }
jar { enabled = true }

def daemonSystems = [
        'KMA_RDR'  : [desc: '기상청A 대형 레이더 데몬 인프라'],
        'KMA_SDR'  : [desc: '기상청A 소형 레이더 데몬 인프라'],
        'KMA_TDWR' : [desc: '기상청A 공항 레이더 데몬 인프라'],
        'MCEE_RDR' : [desc: '기상청B 대형 레이더 데몬 인프라'],
        'MCEE_SDR' : [desc: '기상청B 소형 레이더 데몬 인프라']
]

// 💡 완결: 그레이들 내장 태스크 컨테이너에서 BootJar 클래스 타입을 안전하게 역추적하여 주입합니다.
// 소스 코드 상에서 'org' 문자열이 완전히 청소되므로 문법 해석 오류가 영구적으로 차단됩니다.
def bootJarTaskType = tasks.bootJar.getClass()

daemonSystems.each { sysType, config ->
    tasks.register("bootJar_${sysType}", bootJarTaskType) {
        group = 'build'
        description = "Builds JAR for ${config.desc}"

        // 중복 파일 에러 원천 차단
        duplicatesStrategy = DuplicatesStrategy.INCLUDE

        archiveClassifier = sysType
        archiveVersion = project.version
        mainClass = 'kr.or.kimsn.radar.daemon.RadarDaemonApplication'

        // ❌ [기존 코드 삭제]: with copySpec { from sourceSets.main.output }

        // ⭕ [개선 코드]: 컴파일된 클래스 파일과 resources(YML) 폴더를 안전하게 JAR 표준 경로로 강제 주입
        from(sourceSets.main.output.classesDirs) {
            into 'BOOT-INF/classes'
        }
        from(sourceSets.main.output.resourcesDir) {
            into 'BOOT-INF/classes'
        }

        classpath = sourceSets.main.runtimeClasspath

        // 매니페스트에 시스템 식별 구분자 박제
        manifest {
            attributes(
                    'Start-Class': 'kr.or.kimsn.radar.daemon.RadarDaemonApplication',
                    'Radar-System-Type': sysType
            )
        }
    }
}

tasks.register('buildAllRadarJar') {
    group = 'build'
    description = 'Generates all 5 executable radar daemon JAR files at once.'
    daemonSystems.keySet().each { sysType -> dependsOn "bootJar_${sysType}" }
}
build.dependsOn buildAllRadarJar

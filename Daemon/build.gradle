tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:unchecked' << '-Xlint:deprecation'
}
System.setProperty("file.encoding", "UTF-8")

// ⬇️ 아래 3줄을 바로 이 자리에 새로 추가해 주세요.
System.setProperty("user.language", "ko")
System.setProperty("user.country", "KR")
System.setProperty("sun.stdout.encoding", "UTF-8")

tasks.withType(JavaExec).configureEach {
    jvmArgs += ['-Dfile.encoding=UTF-8', '-Dsun.stdout.encoding=UTF-8', '-Dsun.stderr.encoding=UTF-8']
}

bootJar { enabled = false }
jar { enabled = true }

def daemonSystems = [
    'RDR' : [desc: '기상청A 대형 레이더 데몬 인프라'],
    'SDR' : [desc: '기상청A 소형 레이더 데몬 인프라'],
    'TDWR'  : [desc: '기상청A 공항 레이더 데몬 인프라'],
    'RDR_B' : [desc: '기상청B 대형 레이더 데몬 인프라'],
    'SDR_B' : [desc: '기상청B 소형 레이더 데몬 인프라']
]

// 💡 완결: 그레이들 내장 태스크 컨테이너에서 BootJar 클래스 타입을 안전하게 역추적하여 주입합니다.
// 소스 코드 상에서 'org' 문자열이 완전히 청소되므로 문법 해석 오류가 영구적으로 차단됩니다.
def bootJarTaskType = tasks.bootJar.getClass()

daemonSystems.each { sysType, config ->
    tasks.register("bootJar_${sysType}", bootJarTaskType) {
        group = 'build'
        description = "Builds JAR for ${config.desc}"

        // 중복 파일 에러 원천 차단
        duplicatesStrategy = DuplicatesStrategy.INCLUDE

        archiveClassifier = sysType
        archiveVersion = project.version
        mainClass = 'kr.or.kimsn.radar.daemon.RadarDaemonApplication'

        // ❌ [기존 코드 삭제]: with copySpec { from sourceSets.main.output }

        // ⭕ [개선 코드]: 컴파일된 클래스 파일과 resources(YML) 폴더를 안전하게 JAR 표준 경로로 강제 주입
        from(sourceSets.main.output.classesDirs) {
            into 'BOOT-INF/classes'
        }
        from(sourceSets.main.output.resourcesDir) {
            into 'BOOT-INF/classes'
        }

        classpath = sourceSets.main.runtimeClasspath

        // 매니페스트에 시스템 식별 구분자 박제
        manifest {
            attributes(
                    'Start-Class': 'kr.or.kimsn.radar.daemon.DaemonApplication',
                    'Radar-System-Type': sysType
            )
        }
    }
}

tasks.register('buildAllRadarJar') {
    group = 'build'
    description = 'Generates all 5 executable radar daemon JAR files at once.'
    daemonSystems.keySet().each { sysType -> dependsOn "bootJar_${sysType}" }
}
build.dependsOn buildAllRadarJar


// =======================================================================
// 💡 [운영 배포 자동화 세팅] 기존 코드 손대지 않고 하단 결합 로직만 유지
// =======================================================================
daemonSystems.keySet().each { sysType ->
    tasks.named("bootJar_${sysType}") {
        // 빌드되는 최종 파일명을 인자 없이 띄울 수 있게 'RDR_A.jar' 형태로 깔끔하게 강제합니다.
        archiveFileName = "${sysType}.jar"
        
        // ⭕ 자바 코드가 인식할 수 있도록 jar 파일 내부의 Manifest에 값을 직접 구워넣습니다.
        manifest {
            attributes(
                'Radar-System-Type': sysType
            )
        }
    }
}

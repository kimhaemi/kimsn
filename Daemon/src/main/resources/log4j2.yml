Configuration:
  name: Default
  status: info

  Properties:
    Property:
      - name: log-path
        value: "/home/watcher/deamon/${sys:daemonLogName:-common}/logs"
      - name: default-log-name
        value: "radarCommon"

  Appenders:
    # 💡 Console 어펜더를 비워두어 터미널 출력을 원천 차단합니다.
    Console: []

    RollingFile:
      - name: RollingFile_Appender
        fileName: "./${log-path}/${sys:daemonLogName:-radarCommon}.log"
        filePattern: "./${log-path}/${sys:daemonLogName:-radarCommon}_%d{yyyy-MM-dd}-%i.log"
        immediateFlush: true # 💡 파일 실시간 디스크 쓰기 보장
        PatternLayout:
          Charset: "UTF-8"
          # 💡 클래스명(%logger)이 제거된 깔끔한 포맷
          pattern: "%style{%d{yyyy-MM-dd HH:mm:ss.SSS}}{cyan} %highlight{[%-5p]}{FATAL=bg_red, ERROR=red, INFO=green, DEBUG=blue, TRACE=bg_yellow} - %m%n"
        Policies:
          TimeBasedTriggeringPolicy:
            Interval: 1
            modulate: true
          SizeBasedTriggeringPolicy:
            size: "20 MB"
        DefaultRollOverStrategy:
          max: 10
          Delete:
            basePath: "${log-path}"
            maxDepth: "1"
            IfLastModified:
              age: "P14D"
            IfAccumulatedFileCount:
              exceeds: 140

  Loggers:
    Root:
      level: info
      AppenderRef:
        # 💡 오직 파일로만 출력 방향을 제한합니다.
        - ref: RollingFile_Appender
    Logger:
      - name: kr.or.kimsn
        additivity: false
        level: info
        AppenderRef:
          # 💡 오직 파일로만 출력 방향을 제한합니다.
          - ref: RollingFile_Appender

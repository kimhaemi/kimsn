Configuration:
  name: Default
  status: info

  Properties:
    Property:
      - name: log-path
        value: "logs"
      # 💡 기본값 정의: 혹시 모를 변수 누락 시 방어선 파일명 지정
      - name: default-log-name
        value: "radarCommon"

  Appenders:
    # ⬇️ 콘솔(VS Code 터미널) 출력용 어펜더를 새로 추가합니다.
    Console:
      # - name: Console_Appender
      #   target: SYSTEM_OUT
      #   PatternLayout:
      #     Charset: "utf-8" # 👈 UTF-8에서 MS949로 변경
      #     pattern: "%style{%d{yyyy-MM-dd HH:mm:ss.SSS}}{cyan} %highlight{[%-5p]}{FATAL=bg_red, ERROR=red, INFO=green, DEBUG=blue, TRACE=bg_yellow} %m%n"

    RollingFile:
      - name: RollingFile_Appender
        # 💡 동적 확장: {sys:daemonLogName} 속성과 맞물려 radar_KMA_RDR.log 등으로 분리 출력됩니다.
        fileName: "./${log-path}/radar_${sys:daemonLogName:-${default-log-name}}.log"
        filePattern: "./${log-path}/radar_${sys:daemonLogName:-${default-log-name}}_%d{yyyy-MM-dd}-%i.log"
        PatternLayout:
          Charset: "UTF-8"
          pattern: "%style{%d{yyyy-MM-dd HH:mm:ss.SSS}}{cyan} %highlight{[%-5p]}{FATAL=bg_red, ERROR=red, INFO=green, DEBUG=blue, TRACE=bg_yellow} %m%n"
        Policies:
          TimeBasedTriggeringPolicy:
            Interval: 1
            modulate: true
          SizeBasedTriggeringPolicy:
            size: "20 MB"
        DefaultRollOverStrategy:
          max: 10
          Delete:
            basePath: "${log-path}"
            maxDepth: "1"
            IfLastModified:
              age: "P14D"
            IfAccumulatedFileCount:
              exceeds: 140

  Loggers:
    Root:
      level: info
      AppenderRef:
        - ref: Console_Appender     # 👈 콘솔 추가
        - ref: RollingFile_Appender
    Logger:
      - name: kr.or.kimsn
        additivity: false
        level: info
        AppenderRef:
          - ref: Console_Appender     # 👈 콘솔 추가
          - ref: RollingFile_Appender

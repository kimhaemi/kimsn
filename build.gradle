plugins {
    id 'org.springframework.boot' version '2.7.12' apply false // Java 11 지원하는 안정 버전
    id 'io.spring.dependency-management' version '1.0.15.RELEASE' apply false
    id 'java'
}

// 모든 하위 모듈에 공통 적용되는 설정
subprojects {
    // 플레이스홀더(껍데기) 폴더 모듈은 빌드 대상에서 제외
    if (project.name == 'Daemons') {
        // 이 모듈에는 아무런 빌드 플러그인이나 설정을 적용하지 않고 통과합니다.
        return
    }

    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    group = 'kr.or.kimsn.radar'
    version = '0.0.1-SNAPSHOT'
    sourceCompatibility = '11'
    targetCompatibility = '11'

    // 💡 1. 로깅 충돌 방지를 위해 기본 내장된 Logback(spring-boot-starter-logging)을 완전히 제외합니다.
    configurations {
        all {
            exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
        }
    }

    repositories {
        mavenCentral()
        //  대신 아래 설정을 추가합니다.
//        maven {
//            url "http://apache.org"
//            allowInsecureProtocol = true // SSL 검증 우회 및 HTTP 허용 (Gradle 7.x 이상 필수)
//        }
        // 💡 2. 외부망 보안 차단을 우회하고 자동으로 파일을 받아오는 글로벌 공식 저장소 배치
        maven { url "https://maven.org" }
        maven { url "https://gradle.org" }
        // 3. 로컬 백업용 폴더 (libs)
        flatDir {
            dirs "${rootDir}/libs"
        }
    }

    dependencies {
        // 모든 모듈이 공통으로 사용할 라이브러리
//        implementation 'org.slf4j:slf4j-api'
        /*logback 의존성 추가*/
        implementation 'org.springframework.boot:spring-boot-starter-log4j2:2.7.12'
        testImplementation 'org.springframework.boot:spring-boot-starter-test:2.7.12'

        implementation 'com.googlecode.json-simple:json-simple:1.1.1'

        implementation 'org.springframework.security:spring-security-crypto:5.7.12'

//        // DB 관련 의존성 필수 추가
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
////        implementation name: 'mysql-connector-j-9.2.0'
//        runtimeOnly("com.mysql:mysql-connector-j")

        implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'

        implementation 'org.apache.commons:commons-lang3:3.14.0'
        implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml'
        implementation 'org.modelmapper:modelmapper:2.3.9'

        implementation 'com.google.code.findbugs:jsr305:3.0.2'

        // 💡 Lombok 의존성 정상 주입
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
    }
}

// Root 프로젝트는 빌드 시 JAR 파일을 생성하지 않음
//bootJar { enabled = false }
//jar { enabled = false }









plugins {
    id 'org.springframework.boot' version '4.1.2' apply false // Java 11 지원하는 안정 버전
    /* Claude 주석 (2026-11-19): 위 주석은 기존(2.7.12) 설명. 4.1.2로 변경 — Java 25(OpenJDK 25.0.5.1+) 대응 */
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'java'
}

// 모든 하위 모듈에 공통 적용되는 설정
subprojects {
    // 플레이스홀더(껍데기) 폴더 모듈은 빌드 대상에서 제외
    if (project.name == 'Daemons') {
        // 이 모듈에는 아무런 빌드 플러그인이나 설정을 적용하지 않고 통과합니다.
        return
    }

    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    group = 'kr.or.kimsn.radar'
    version = '0.0.1-SNAPSHOT'
    /* Claude 주석 (2026-11-19): sourceCompatibility/targetCompatibility = '11' → Java 25 toolchain
         (Gradle 9에서 project 수준 sourceCompatibility/targetCompatibility 속성이 제거됨) */
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    /* Claude 주석 (2026-11-19): JUnit 5(Jupiter) 테스트 실행 설정. 없으면 Gradle 9이 테스트를 찾지 못함 */
    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    // 💡 1. 로깅 충돌 방지를 위해 기본 내장된 Logback(spring-boot-starter-logging)을 완전히 제외합니다.
    configurations {
        all {
            exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
        }
    }

    repositories {
        mavenCentral()
        //  대신 아래 설정을 추가합니다.
//        maven {
//            url "http://apache.org"
//            allowInsecureProtocol = true // SSL 검증 우회 및 HTTP 허용 (Gradle 7.x 이상 필수)
//        }
        // 💡 2. 외부망 보안 차단을 우회하고 자동으로 파일을 받아오는 글로벌 공식 저장소 배치
        /* Claude 주석 (2026-11-19): 위 주석의 저장소 2개(https://maven.org, https://gradle.org)는 Maven 저장소가 아니라 제거함 */
        // 3. 로컬 백업용 폴더 (libs)
        flatDir {
            dirs "${rootDir}/libs"
        }
    }

    dependencies {
        // 모든 모듈이 공통으로 사용할 라이브러리
//        implementation 'org.slf4j:slf4j-api'
        /*logback 의존성 추가*/
        /* Claude 주석 (2026-11-19): 버전은 Spring Boot BOM(4.1.2)이 관리 — 개별 버전 하드코딩 제거 */
        implementation 'org.springframework.boot:spring-boot-starter-log4j2'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher' /* Claude 주석 (2026-11-19): Gradle 9부터 명시 필요 */

        implementation 'com.googlecode.json-simple:json-simple:1.1.1'

        implementation 'org.springframework.security:spring-security-crypto'

//        // DB 관련 의존성 필수 추가
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
////        implementation name: 'mysql-connector-j-9.2.0'
//        runtimeOnly("com.mysql:mysql-connector-j")

        /* Claude 주석 (2026-11-19): log4j2.yml 설정 파일 파싱용 (Log4j2는 Jackson 2 사용 → Boot의 jackson-2-bom이 관리) */
        implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'

        implementation 'org.apache.commons:commons-lang3' /* Claude 주석 (2026-11-19): 3.14.0 → BOM 관리 (3.20.0) */
        /* Claude 주석 (2026-11-19): Spring Boot 4는 Jackson 3(tools.jackson) 사용 → XML 메시지 변환도 Jackson 3 모듈로 교체 */
        implementation 'tools.jackson.dataformat:jackson-dataformat-xml'
        implementation 'org.modelmapper:modelmapper:3.2.8'

        implementation 'com.google.code.findbugs:jsr305:3.0.2'

        // 💡 Lombok 의존성 정상 주입
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
    }
}

// Root 프로젝트는 빌드 시 JAR 파일을 생성하지 않음

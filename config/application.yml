# 💡 외부 노출: 자바 소스코드 재빌드 없이 리눅스 환경 변수와 주입 맵을 자유롭게 수정 관리합니다.
radar:
  config:
    cron-expression: "0 * * * * *"
    
    # ====================================================
    # 💡 [통합] 모든 데몬과 관측소가 100% 동일하게 공유하는 최상위 시스템 공통 변수
    # step1 - 파일처리
    # site 접속 타임아웃 35초 (초단위로 계산됨)
    # sessionTimeOut=5
    # connectTimeOut=35

    # step2 - 문자 전송
    # step1 처리 후 일시 정지 20초(초단위로 계산됨)
    # PauseTime=40
    # ====================================================
    global:
      mode: "real"
      # 💡 [일부 지점 오류 테스트의 핵심 기믹]
      # 특정 지점 코드(siteCd)를 기입하면, 해당 지점이 정산 주기를 돌 때만 
      # 아래의 가상 에러 코드가 수집 이력 테이블(receive_data)에 강제로 인서트됩니다.
      target_site: ""          # 🎯 장애 테스트 대상 관측소 지정 (예: 수리산만 저격)
      # 💡 [실시간 수집 결과 강제 주입 가드 속성]
      # mode가 test일 때, 실제 관측소에 붙어서 방금 유입된 실시간 결과 한 건인 것처럼 이 데이터가 꽂힙니다.
      # RECV" "정상"
      # MISS: 주의, 품질이상, 미수신
      # RETR: 정상복구
      # TOTA: 전체장애
      # TORE: 전체복구
      recv_condition: "RECV"       # 🔄 시나리오에 따라 RECV 또는 MISS로 교체 테스트
      # ok: 정상 수신
      # file_no: 자료 미수신
      # filesize_no: 파일 품질 이상
      # network_no: 네트워크 장애
      # network_ok: 네트워크 복구
      # file_ok: 파일 미수신 복구
      # filesize_ok: 파일 품질 복구
      codedtl: "filesize_ok"           # 🔄 시나리오에 따라 ok, file_no, filesize_no, network_no 등으로 교체 테스트
      call_from: "027337365"
      template_code: "radar_0001"
      sessionTimeOut: 5
      connectTimeOut: 35
      PauseTime: 20

    # ====================================================
    # 💡 데몬 인프라 유형별 스케줄러 표현식 및 소속 관측소 맵
    # ====================================================
    paths:
      # ----------------------------------------------------
      # 1. 기상청 대형 레이더 데몬 (KMA_RDR)
      # 실행: java -jar -DDAEMON_TYPE=KMA_RDR radardemo.jar

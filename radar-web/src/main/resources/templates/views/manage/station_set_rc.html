<!DOCTYPE html>

	<th:block layout:fragment="content">
      <script th:inline="javascript">
          /* <![CDATA[ */
          // 백엔드에서 단일 리스트로 넘겼으므로 receiveList는 그대로 유지됩니다.
          var receiveList = /*[[${receiveList}]]*/
              console.log(receiveList);
          /* ]]> */
      </script>

      <script type="text/javascript">
          $(function() {
              $("#configSave").on("click", function(){
                  let list = new Array();

                  $("input[name=config]").each(function(idx, item){
                      let jObj = new Object();

                      // ==========================================
                      // [수정 핵심 1] ID가 "KMA-site-dataType" 형태로 바뀌었으므로 3개로 파싱합니다.
                      // ==========================================
                      let idParts = item.id.split("-");
                      let agencyCd = idParts[0];   // 'KMA' 또는 'MCEE'
                      let site = idParts[1];       // 기존의 site
                      let dataType = idParts[2];   // 기존의 dataType

                      receiveList.forEach(e => {
                          // ==========================================
                          // [수정 핵심 2] 비교 조건에 agencyCd(agency_cd)를 추가하여 정확한 대상을 찾습니다.
                          // ==========================================
                          let matchAgency = (e.agencyCd == agencyCd || e.agency_cd == agencyCd);

                          if(matchAgency && e.site == site && e.dataType == dataType){
                              jObj.site = e.site;
                              jObj.dataKind = e.dataKind;
                              jObj.dataType = e.dataType;
                              jObj.data_name = e.data_name;
                              jObj.sms_send_activation = $(item).is(":checked") ? 1 : 0;
                              jObj.status = e.status;

                              // ==========================================
                              // [수정 핵심 3] 서버 DTO에도 agency_cd가 들어가야 하므로 데이터를 세팅합니다.
                              // DTO 필드명(agencyCd 또는 agency_cd)에 맞춰서 보내주세요.
                              // ==========================================
                              jObj.agencyCd = agencyCd;
                              jObj.agency_cd = agencyCd;

                              list.push(jObj);
                          }
                      });
                  });

                  if(confirm("저장 하겠습니까?")){
                      let result = fnCall('post', '/manage/station_set_rc_modify', JSON.stringify(list));

                      console.log("result :: "+ result.status);
                      if(result.status == "success"){
                          alert("저장되었습니다.");
                          location.href="/manage/station_set_rc"; //다시 로딩
                      } else {
                          alert("저장에 실패하였습니다. \n" + result.data);
                      }
                  }
              });
          });
      </script>

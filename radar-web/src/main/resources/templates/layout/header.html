        <script type="text/javascript">
            var menuList;
            $(document).ready(function () {

              var path = window.location.pathname.toString().trim();
              if (path === "") path = "/"; // 메인 페이지 대응

              // 1. 대메뉴 활성화
              $(".navi > div > li").each(function () {
                var url = $(this).find("> a").attr("href").toString().trim();
                if (url == path) {
                  $(this).addClass("on");
                }
              });

              // 2. 서브 메뉴 활성화 (지점 모니터링 및 5000번대 관리 메뉴 일괄 처리)
              $(".sub a").each(function () {
                var url = $(this).attr("href").toString().trim();

                // 💡 글자 겹침 버그(rc, rcc)를 막기 위한 정확한 매칭 조건 2가지
                var exactMatch = (path == url);                    // 주소가 100% 똑같을 때 (5000번대용)
                var folderMatch = (path.indexOf(url + "/") === 0);  // 뒤에 하위 지점 코드가 붙을 때 (2000~4000번용)

                if (exactMatch || folderMatch) {
                  $(this).addClass("on"); // <a> 태그 활성화

                  // 5000번대 메뉴일 경우 감싸고 있는 <li> 태그도 활성화
                  var parentLi = $(this).closest("li");
                  if (!parentLi.hasClass("subTitle") && parentLi.css("display") !== "flex") {
                    parentLi.addClass("on");
                  }

                  // 상위 대메뉴 li도 자동으로 활성화 상태로 유지
                  $(this).closest(".navi > div > li").addClass("on");
                }
              });

              // 3. 메인 로고 클릭 이벤트
              $(".header h1").on("click", function () {
                location.href = "/";
                return false;
              });

              $(".header h1").hover(function () {
                $(this).css("cursor", "pointer");
              });

              // 4. 서브메뉴 마우스 호버 애니메이션
              $('.navi > div').on({
                mouseenter: function () {
                  var sub = $(this).find('.sub');
                  sub.stop().slideDown();
                },
                mouseleave: function () {
                  var sub = $(this).find('.sub');
                  sub.stop().slideUp();
                }
              });
            });

            //menu List
            function menuData() {    
                $.ajax({
                    type: "GET",
                    url: "/getMenuData",
                    contentType : 'application/json; charset=utf-8',
                    dataType : 'json',
                    success: function (data) {
                        console.log(data);
                        // menuList = data.menuList;

                        // $(".data").replaceWith(data);
                    },
                    error :function (request, status, error) {
                        console.log("error");
                        console.log(error);
                    }
                });
            }

        </script>

        <div class="header">

                                    </li>

                                        <th:block th:each="sList : ${list.stationList}">
                                          <a th:if="${sList.gubun == 1 && sList.agencyCd == 'MCEE'}"
                                             th:href="${mList.id == 2000 ? '/station/' + sList.siteCd : (mList.id == 3000 ? '/station/hist/' + sList.siteCd : '/stat/' + sList.siteCd)}"

                                    <li style="display: flex; width: 100%; font-weight: bold; font-size: 14px; color: #000; margin-top: 5px; margin-bottom: 5px; list-style: none;">
                                      <div style="width: 50%; ">기상청</div>
                                      <div style="width: 50%; ">기후부</div>

                                    <li style="display: flex; width: 100%; list-style: none;">
                                      <!-- 좌측 열 (기상청 소형) -->

                                        <th:block th:each="sList : ${list.stationList}">

                                  <!-- [CASE B] 시스템 관리 메뉴 (5000번 일 때) -->

Configutation:
  name: Default
  status: info
 
  Properties:
    Property:
      name: log-path
      value: "logs"
 
  Appenders:
    RollingFile:
      - name: RollingFile_Appender
        fileName: ./${log-path}/radar_web.log
        filePattern: "./${log-path}/radar_web_%d{yyyy-MM-dd}-%i.log"
        PatternLayout:
          pattern: "%style{%d{yyyy-MM-dd HH:mm:ss.SSS}}{cyan} %highlight{[%-5p]}{FATAL=bg_red,
            ERROR=red, INFO=green, DEBUG=blue, TRACE=bg_yellow} %m%n"
        Policies:
          TimeBasedTriggeringPolicy:
            Interval: 1
            modulate: true
          SizeBasedTriggeringPolicy:
            size: "10 MB"
        DefaultRollOverStrategy:
          max: 10
          Delete:
            basePath: "${log-path}"
            maxDepth: "1"
            IfLastModified:
              age: "P14D"
            IfAccumulatedFileCount:
              exceeds: 140
    Console:
      name: Console_Log
      target: SYSTEM_OUT
      PatternLayout:
        pattern: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n"

  Loggers:
    Root:
      level: info
      AppenderRef:
        - ref: Console_Log # RollingFile_Appender
    Logger:
      - name: kr.or.kimsn.radar
        additivity: false
        level: info
        AppenderRef:
          - ref: RollingFile_Appender

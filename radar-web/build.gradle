// 실제 실행되는 메인 모듈이므로 bootJar 활성화
bootJar { enabled = true }
jar { enabled = false }

bootJar {
    archiveBaseName.set('RADAR_WEB')
    archiveVersion.set('') // 버전명을 생략하고 data.jar로 맞출 때 사용합니다
}

dependencies {
    // 비즈니스 로직이 담긴 api-module을 가져옴 (api-module이 db-module을 품고 있음)
//    implementation project(':radar-api')
    implementation project(':common-data')

    //thymeleaf layout
    implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect'

    // 웹 서비스 제공을 위한 의존성 (Spring Boot 4: starter-web → starter-webmvc 로 명칭 변경)
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    // 필요 시 타임리프 등 추가
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    //spring-boot-devtools .html파일을 컴파일만 해주면 서버 재시작 없이 view 파일 변경이 가능
    // (2026-11-19) implementation → developmentOnly: 운영 jar(bootJar)에 포함되지 않도록
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    implementation 'org.springframework.boot:spring-boot-starter-security'
    // 템플릿의 sec: 네임스페이스(xmlns:sec) 처리를 위해 추가 (기존에는 의존성 누락으로 미동작)
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

}
//날짜 시간
function today_Hmdhis() {
	var dt= new Date();
	var year=dt.getYear();
	var month=dt.getMonth()+1;
	var days=dt.getDate();
	var hour,min,sec ,dTime,tmp;
	month=""+month; days=""+days; hour=""+dt.getHours(); min=""+dt.getMinutes(); sec=""+dt.getSeconds();
	month		=(month.length	==1)?"0"+month	:	month;
	days		=(days.length	==1)?"0"+days	:	days;
	hour	=(hour.length	==1)?"0"+hour	:	hour;
	min		=(min.length	==1)?"0"+min	:	min;
	sec		=(sec.length	==1)?"0"+sec	:	sec;
	dTime= hour +":"+ min +":"+ sec;
	tmp = year+"-"+month+"-"+days+" "+dTime ;
	return tmp;
}


// trim 선언 메시지 최종 (압뒤 공백 제거)
if(!String.prototype.trim) {
  String.prototype.trim = function (){ return this.replace(/^[\s\uFEFF\xA0]+|[\s\uFEFF\xA0]+$/g,''); };
}

function etrim(value){  //실제 트림실행.
		value = value.replace(/\s+/, "");
		//왼쪽 공백제거
		value = value.replace(/\s+$/g, "");
		//오른쪽 공백제거
		value = value.replace(/\n/g, "");
		//행바꿈제거
		value = value.replace(/\r/g, "");
		//엔터제거
		return value;
}

function GetBytes(aro_name){

function getByteLengh(pstr) {
    var str = pstr.value.substring(0);
		//alert("["+str+"]");
		//str = str.trim();			   //앞뒤 공백제거
		str = str.replace(/\r\n/g,'\n')// 줄바꿈 1byte 처리
		//alert("["+str+"]");
		//alert(str);
    var len = 0;
    var lens = 0;
    var overlength = false;
    var msgType;
    var isMms=false;
	    msgType= "SMS";

    for (i = 0; i < str.length; i++){
        var ch = escape(str.charAt(i));
        if (ch.length == 1) len++;
        else if (ch.indexOf("%u") != -1) len += 2;
        else if (ch.indexOf("%") != -1) len += ch.length / 3;

        if (len > 90) {
    		msgType= "LMS";
			document.MessagSendForm.MSG_TXT.color='#0000FF';
        }else{
        	msgType= "SMS";
			document.MessagSendForm.MSG_TXT.color='#FF0000';
        }

        if (len <= 2000) {
            lens = i;
            if (ch.indexOf("%u") != -1) lens = lens + 1;
        }
        else {
            overlength = true;
            if (ch.length == 1) len--;
            else if (ch.indexOf("%u") != -1) len -= 2;
            else if (ch.indexOf("%") != -1) len -= ch.length / 3;
        }
    } //end for

    if (overlength) {
        alert("메시지는 2000byte까지 작성 가능합니다");
        pstr.value = pstr.value.substring(0, lens);
        len = bytelength(pstr);
    }
	document.MessagSendForm.ThisByte.value=len;
	document.MessagSendForm.MsgType.value=msgType;
	//document.MessagSendForm.MSG_TXT.value=str;
	document.MessagSendForm.ThisLength.value=str.length;  // 전체길이;
}

function bytelength(pstr) {
    var str = pstr.value.substring(0).trim();
    var len = 0;
    for (i = 0; i < str.length; i++) {
        var ch = escape(str.charAt(i));
        if (ch.length == 1) len++;
        else if (ch.indexOf("%u") != -1) len += 2;
        else if (ch.indexOf("%") != -1) len += ch.length / 3;
    }
    return len;
}
